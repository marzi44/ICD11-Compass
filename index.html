<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>ICD11 Compass</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ICD11 Compass">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Layout: quiet iOS-style shell. Blurred top bar, one 640px column of hairline cards, bottom tab bar
   (floating on wide screens). Lessons, sheets and onboarding are full-screen layers.
   Direction: iOS grouped lists, system font, one deep green tint, hairlines instead of shadows. */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#E9E9EE; --ink:#0B0C0E; --ink-2:#3C3C43; --muted:#6C6C70;
  --line:#D8D8DC; --line-2:#C7C7CC;
  --accent:#1E6B57; --accent-2:#17513F; --accent-soft:#E6F0EC; --on-accent:#FFFFFF;
  --btn:#0B0C0E; --on-btn:#FFFFFF;
  --gold:#A87B22; --gold-2:#8A6418; --gold-soft:#F5EEDF;
  --orange:#B8612C; --orange-soft:#F6EAE1;
  --coral:#B8443C; --coral-soft:#F8E9E7;
  --good:#23845E; --good-2:#1B6849; --good-soft:#E5F2EC;
  --bad:#BE4038; --bad-2:#9A322B; --bad-soft:#F9EAE8;
  --blue:#3D5A9E; --blue-2:#2F4780;
  --u0:#1E6B57; --u0d:#1E6B57; --u1:#3D5A9E; --u1d:#3D5A9E; --u2:#9C6A2E; --u2d:#9C6A2E; --u3:#6E4F92; --u3d:#6E4F92;
  --scrim:rgba(10,12,14,.38);
  --shadow:0 1px 2px rgba(17,20,23,.04),0 8px 24px rgba(17,20,23,.06);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --f-mono:var(--f-body);
  --r-sm:10px; --r:12px; --r-lg:16px; --tab-h:50px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --ink:#FFFFFF; --ink-2:#D1D1D6; --muted:#8E8E93;
  --line:#38383A; --line-2:#48484A;
  --accent:#5FBF9F; --accent-2:#46A384; --accent-soft:#15302A; --on-accent:#06150F;
  --btn:#FFFFFF; --on-btn:#000000;
  --gold:#D6A74A; --gold-2:#B88A33; --gold-soft:#2C2416; --orange:#E08A55; --orange-soft:#2E2016;
  --coral:#E07A72; --coral-soft:#301A18; --good:#52C08F; --good-2:#3FA376; --good-soft:#12291E;
  --bad:#E5756C; --bad-2:#C85A51; --bad-soft:#311917; --blue:#8AA2E0; --blue-2:#6F88C8;
  --u0:#5FBF9F; --u0d:#5FBF9F; --u1:#8AA2E0; --u1d:#8AA2E0; --u2:#D19B5C; --u2d:#D19B5C; --u3:#B497DB; --u3d:#B497DB;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --ink:#FFFFFF; --ink-2:#D1D1D6; --muted:#8E8E93;
  --line:#38383A; --line-2:#48484A;
  --accent:#5FBF9F; --accent-2:#46A384; --accent-soft:#15302A; --on-accent:#06150F;
  --btn:#FFFFFF; --on-btn:#000000;
  --gold:#D6A74A; --gold-2:#B88A33; --gold-soft:#2C2416; --orange:#E08A55; --orange-soft:#2E2016;
  --coral:#E07A72; --coral-soft:#301A18; --good:#52C08F; --good-2:#3FA376; --good-soft:#12291E;
  --bad:#E5756C; --bad-2:#C85A51; --bad-soft:#311917; --blue:#8AA2E0; --blue-2:#6F88C8;
  --u0:#5FBF9F; --u0d:#5FBF9F; --u1:#8AA2E0; --u1d:#8AA2E0; --u2:#D19B5C; --u2d:#D19B5C; --u3:#B497DB; --u3d:#B497DB;
  --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);letter-spacing:-.006em;-webkit-font-smoothing:antialiased;min-height:100vh;font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.028em;margin:0;line-height:1.12;text-wrap:balance}
p{margin:0}
svg{flex:none}
.wrap{width:100%;max-width:640px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);padding-top:env(safe-area-inset-top,0px);border-bottom:.5px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topin{display:flex;align-items:center;gap:10px;height:54px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.logo svg{width:26px;height:26px}
.pills{margin-left:auto;display:flex;gap:2px}
.pill{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 9px;border-radius:999px;background:none;border:0;font-weight:500;font-size:15px;color:var(--ink);cursor:pointer}
.pill svg{width:16px;height:16px}
.pill:active{background:var(--surface-2)}
.pill.fl svg{color:var(--orange)} .pill.fl.off svg{color:var(--line-2)} .pill.xp svg{color:var(--accent)} .pill.ht svg{color:var(--coral)}

/* Bottom tab bar */
main{padding-top:6px;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 40px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:.5px solid var(--line);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.tabbar .in{display:flex;max-width:520px;margin:0 auto;height:var(--tab-h)}
.tb{flex:1;display:grid;justify-items:center;align-content:center;gap:3px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;padding:0}
.tb .ic{display:grid;place-items:center;height:26px}
.tb svg{width:23px;height:23px;stroke-width:1.8}
.tb[aria-current="page"]{color:var(--ink)}
@media (min-width:900px){
  .tabbar{left:50%;right:auto;bottom:20px;transform:translateX(-50%);width:400px;border:.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:0}
  main{padding-bottom:120px}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);color:var(--ink);font-weight:550;font-size:16px;cursor:pointer;transition:transform .12s ease,opacity .12s ease,background .15s;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn:active:not(:disabled){transform:scale(.98);opacity:.85}
.btn.primary,.btn.white{background:var(--btn);color:var(--on-btn);border-color:var(--btn)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2);min-height:44px;padding:0 10px}
.btn.ghost.sm{min-height:34px;color:var(--accent);font-weight:550}
.btn:disabled{background:var(--surface-2);border-color:var(--surface-2);color:var(--muted);cursor:default}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:none;color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px;stroke-width:1.8}
.iconbtn:active{background:var(--surface-2)}
.say{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.say svg{width:17px;height:17px}
.say:active{transform:scale(.92)}

/* Cards & sections */
.card{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r);padding:18px}
.sect{display:grid;gap:14px;margin-top:28px}
.sect>h2{font-size:21px}
.kicker{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.udot{width:6px;height:6px;border-radius:50%;background:var(--uc,var(--accent));display:inline-block;flex:none}
.page-h{display:grid;gap:4px;padding-top:10px}
.page-h h1{font-size:32px}
.bar{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.segs i{height:4px;border-radius:2px;background:var(--surface-2)}
.segs i.on{background:var(--uc,var(--accent))}

/* Learn */
.greet{display:grid;gap:4px;padding:14px 0 18px}
.greet h1{font-size:30px}
.hero{border-radius:var(--r-lg);padding:22px;background:var(--surface);border:.5px solid var(--line);box-shadow:var(--shadow);display:grid;gap:12px}
.hero h2{font-size:27px}
.hero p{color:var(--muted);font-size:15px;margin-top:-6px}
.hero .btn{margin-top:6px}
.today{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:12px}
.today>div>b{font-weight:600}
.ring{width:58px;height:58px;position:relative}
.ring svg{width:58px;height:58px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring b{position:absolute;inset:0;display:grid;place-items:center;color:var(--accent)}
.ring b svg{width:20px;height:20px;transform:none}
.week{display:flex;gap:8px;margin-top:10px}
.day{display:grid;justify-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted)}
.day i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--on-btn)}
.day i svg{width:12px;height:12px}
.day.on i{background:var(--ink-2);border-color:var(--ink-2)}
.day.goal i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day.now span{color:var(--ink);font-weight:600}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.qt{display:grid;gap:6px;align-content:start;text-align:left;background:var(--surface);border:.5px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:transform .12s}
.qt:active:not(:disabled){transform:scale(.98)}
.qt:disabled{cursor:default;opacity:.55}
.qt .qi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink);margin-bottom:4px}
.qt .qi svg{width:18px;height:18px}
.qt b{font-size:15.5px;font-weight:600;line-height:1.25}
.qt span{font-size:13.5px;color:var(--muted);line-height:1.35}
.notice{display:flex;gap:12px;align-items:center;background:var(--surface);border:.5px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.notice>svg{width:20px;height:20px;color:var(--accent)}
.notice div{flex:1;font-size:14.5px}
.pathhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:40px 2px 12px}
.pathhead h2{font-size:21px}
.unit{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r);padding:16px 16px 18px;margin-top:10px;scroll-margin-top:12px}
.unit.current{box-shadow:var(--shadow);border-color:var(--line-2)}
.unit.complete .uhead h2{color:var(--ink-2)}
.uhead{display:flex;gap:12px;align-items:flex-start}
.uhead>div{flex:1;min-width:0}
.uhead h2{font-size:18px;margin-top:6px;letter-spacing:-.02em}
.uhead p{font-size:14px;color:var(--muted);margin-top:2px}
.newb{color:var(--accent);font-weight:600}
.nodes{display:flex;align-items:center;margin-top:16px}
.nodes .link{flex:1;height:1px;background:var(--line-2);min-width:6px}
.node{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);display:grid;place-items:center;font-size:14px;font-weight:550;cursor:pointer;padding:0;flex:none;transition:transform .12s}
.node:active{transform:scale(.92)}
.node svg{width:16px;height:16px}
.node.done{background:var(--uc);border-color:var(--uc);color:var(--surface)}
.node.cur{border:1.5px solid var(--ink);color:var(--ink);box-shadow:0 0 0 4px var(--surface-2)}
.node.lock{color:var(--line-2)}
.node.trophy{border-style:dashed;color:var(--line-2)}
.node.trophy.won{border-style:solid;border-color:var(--gold);color:var(--gold)}
.endcard{margin-top:28px;display:grid;gap:12px;justify-items:start}
.endcard .sic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);color:var(--accent);display:grid;place-items:center}
.endcard .sic svg{width:20px;height:20px}
.endcard h2{font-size:19px}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:70;display:grid;align-items:end}
.sheet .bd{position:absolute;inset:0;background:var(--scrim);animation:fade .2s ease}
.sheet .pn{position:relative;width:100%;max-width:540px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:8px max(22px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px));display:grid;gap:14px;max-height:88vh;overflow:auto;animation:sheetUp .34s cubic-bezier(.2,.9,.25,1)}
.sheet .grab{width:36px;height:5px;border-radius:9px;background:var(--line-2);justify-self:center;margin-bottom:6px}
.sheet h2{font-size:23px}
.sheet .sic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2)!important;color:var(--ink)}
.sheet .sic svg{width:22px;height:22px}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.fact{display:inline-flex;align-items:center;gap:6px;border:.5px solid var(--line-2);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.fact svg{width:14px;height:14px}
@media (min-width:700px){.sheet{align-items:center}.sheet .pn{border-radius:24px;padding-bottom:22px}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}

/* Lesson */
.lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px)}
.lhead{display:flex;align-items:center;gap:12px;width:100%;max-width:640px;margin:0 auto;padding:8px max(14px,env(safe-area-inset-right,0px)) 4px max(8px,env(safe-area-inset-left,0px))}
.lprog{flex:1;height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.lprog i{display:block;height:100%;border-radius:99px;background:var(--ink);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.lhearts{display:flex;align-items:center;gap:4px;color:var(--ink);font-weight:550;font-size:15px;min-width:40px;justify-content:flex-end}
.lhearts svg{width:16px;height:16px;color:var(--coral)}
.lhearts.xp svg{color:var(--accent)}
.lbody{overflow-y:auto;-webkit-overflow-scrolling:touch}
.lwrap{max-width:600px;margin:0 auto;padding:22px max(22px,env(safe-area-inset-right,0px)) 28px max(22px,env(safe-area-inset-left,0px));display:grid;gap:22px}
.lwrap.enter{animation:slideIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}}
.etype{display:inline-flex;align-items:center;gap:6px;justify-self:start;font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.etype svg{width:14px;height:14px}
.streakchip{display:inline-flex;align-items:center;gap:4px;color:var(--orange);font-family:var(--f-mono);font-size:11.5px;font-weight:500;margin-left:10px}
.streakchip svg{width:12px;height:12px}
.qtitle{font-family:var(--f-display);font-size:25px;font-weight:600;line-height:1.22;letter-spacing:-.025em}
.qtext{display:flex;gap:12px;align-items:center;font-size:18px;line-height:1.5;padding:16px 18px;border:.5px solid var(--line);border-radius:var(--r);background:var(--surface)}
.qtext span{flex:1}
.gap{display:inline-block;min-width:80px;height:1.1em;border-bottom:2px solid var(--ink);margin:0 3px;vertical-align:-2px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;min-height:56px;border:1px solid var(--line);background:var(--surface);padding:12px 16px;border-radius:14px;cursor:pointer;font-size:16.5px;line-height:1.38;transition:transform .1s,background .15s,border-color .15s}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .k{display:none;width:24px;height:24px;flex:none;border:1px solid var(--line-2);border-radius:7px;place-items:center;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
@media (hover:hover){.opt .k{display:grid}.opt:hover:not(:disabled){border-color:var(--line-2)}}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt[aria-pressed="true"] .k{border-color:var(--ink);color:var(--ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft);box-shadow:inset 0 0 0 1px var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad);animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.listen{display:flex;gap:12px;align-items:center;justify-content:center;padding:8px 0}
.lbtn{width:84px;height:84px;border-radius:50%;border:0;background:var(--btn);color:var(--on-btn);cursor:pointer;display:grid;place-items:center;transition:transform .12s}
.lbtn svg{width:34px;height:34px}
.lbtn:active{transform:scale(.94)}
.lbtn.slow{width:auto;height:44px;border-radius:999px;padding:0 16px;font-weight:550;font-size:14px;display:flex;gap:6px;background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.lbtn.slow svg{width:18px;height:18px}
.answerline{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:110px;padding:10px 0;background:repeating-linear-gradient(transparent 0 52px,var(--line) 52px 53px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-height:44px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:12px;cursor:pointer;font-size:16.5px;transition:transform .1s}
.tile:active{transform:scale(.96)}
.tile.ghost{background:var(--surface-2);border-color:var(--surface-2);color:transparent;cursor:default}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:grid;gap:8px;align-content:start}
.match .tile{width:100%;text-align:center;font-size:15px;line-height:1.3;min-height:56px}
.match .tile.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.match .tile.gone{opacity:.3;cursor:default;border-color:var(--good)}
.match .tile.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
input.field,textarea.field,select.field{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;font-size:17px}

.lfoot.ok{background:var(--good-soft);border-top-color:transparent}

.no .fbt b{color:var(--bad-2)}
.fbt p{font-size:15px;overflow-wrap:anywhere}
.fbt .ans{color:var(--ink);font-weight:600}
.fbt .why{color:var(--ink-2)}
.fbt .mine{color:var(--ink-2)}

.risk{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:14.5px;color:var(--ink-2)}

.gate .center{gap:16px}
.heard{min-height:48px;text-align:center;font-size:17px;line-height:1.45;color:var(--muted);padding:6px 4px}

.btn.rec{animation:recPulse 1.2s ease-in-out infinite}
@keyframes recPulse{50%{opacity:.72}}
.verdict{font-size:15.5px;color:var(--ink-2);max-width:36ch;text-wrap:pretty}

#lesson:not([hidden]) ~ .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 64px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fbt b{color:var(--good)} :root:not([data-theme="light"]) .no .fbt b{color:var(--bad)}}
:root[data-theme="dark"] .fbt b{color:var(--good)} :root[data-theme="dark"] .no .fbt b{color:var(--bad)}
@media (min-width:700px){.fb{grid-template-columns:1fr auto;align-items:center}.fb .btn{min-width:180px}}
.center{max-width:440px;margin:0 auto;padding:36px max(24px,env(safe-area-inset-right,0px)) 32px max(24px,env(safe-area-inset-left,0px));display:grid;justify-items:center;text-align:center;gap:14px;align-content:center;min-height:100%}

.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:99px;background:var(--line-2);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}

.foot{text-align:center;font-size:12.5px;color:var(--muted);margin-top:26px}

.steps i{width:18px;height:3px;border-radius:9px;background:var(--line-2)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--on-btn);padding:10px 18px;border-radius:14px;font-size:14px;font-weight:500;z-index:90;max-width:calc(100% - 40px);text-align:center;animation:fbUp .25s;box-shadow:var(--shadow)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:85}

function blank(){return {v:1,onb:false,cfg:{goal:20,sound:true,theme:"auto"},units:{},box:{},xp:{},days:[],hearts:{n:HMAX,t:Date.now()},mistakes:[],stats:{lessons:0,answered:0,correct:0,perfect:0},lastBackup:0};}

  if(!S.days.includes(today())){S.days.push(today());S.days=S.days.slice(-500);}save();}

function tones(seq){if(!S.cfg.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t0=actx.currentTime+.02;let t=t0;
  seq.forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);t+=d*.8;});}catch(e){}}
const sndOk=()=>tones([[660,.12],[880,.18]]),sndNo=()=>tones([[220,.2]]),sndWin=()=>tones([[523,.12],[659,.12],[784,.12],[1047,.3]]);

  const cols=["#1F5E7A","#A87B22","#B8443C","#5B4C9A","#2E7D5B"];const P=Array.from({length:110},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*10,vy:-Math.random()*11-3,r:Math.random()*6+3,c:pick(cols),a:Math.random()*6}));
  let t=0;(function f(){x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore();});
    if(++t<110)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.hidden=true;}})();}

/* ---------- Aufgaben erzeugen ---------- */
const nameOf=it=>it.n;
function distract(it,pool,n,key){
  const seen=new Set([key(it)]),out=[];
  const add=arr=>{for(const x of shuffle(arr.slice())){if(out.length>=n)break;const k=key(x);if(seen.has(k))continue;seen.add(k);out.push(x);}};
  add(pool.filter(x=>x.c!==it.c&&x.map===it.map));
  const g=it.c.slice(0,3);add(ALL.filter(x=>x.map===it.map&&x.c.slice(0,3)===g));
  add(ALL.filter(x=>x.map===it.map&&x.c.slice(0,2)===it.c.slice(0,2)));
  add(ALL.filter(x=>x.map===it.map));
  return out;
}
function mc(type,it,pool,title,q,label,optOf,key,codeonly){
  const ds=distract(it,pool,3,key);if(ds.length<2)return null;
  const opts=shuffle([it,...ds]).map(x=>({h:optOf(x),ok:x.c===it.c}));
  return {type,item:it.c,label,title,q,opts,codeonly:!!codeonly};
}
function makeEx(t,it,pool){
  const block=it.map;
  switch(t){
    case "name":return mc(t,it,pool,block?"Welche Gruppe beginnt so?":"Welche Diagnose hat diesen Code?",`<span class="bigcode">${esc(it.c)}${block?"…":""}</span>`,block?"Code → Gruppe":"Code → Diagnose",x=>esc(x.n),nameOf);
    case "code":return mc(t,it,pool,block?"Mit welchen Zeichen beginnt diese Gruppe?":"Welcher Code passt?",`<span>${esc(it.n)}</span>`,"Diagnose → Code",x=>esc(x.c)+(block?"…":""),x=>x.c,true);
    case "vig":if(!it.k)return null;return mc(t,it,pool,block?"Welche Gruppe enthält das?":"Welche Diagnose passt zur Beschreibung?",`<span>${esc(it.k)}</span>`,block?"Inhalt":"Fallbeschreibung",x=>`<span class="code">${esc(x.c)}${block?"…":""}</span>${esc(x.n)}`,nameOf);
    case "i10":if(!i10Exact(it)||block)return null;return mc(t,it,pool.filter(x=>x.i10!==it.i10),"ICD-10 → ICD-11",`<span>In der ICD-10 war das <b class="code">${esc(it.i10)}</b>. Welcher ICD-11-Code entspricht dem?</span>`,"Umstieg",x=>`<span class="code">${esc(x.c)}</span>${esc(x.n)}`,x=>x.i10?"i:"+x.i10:x.c);
    case "diff":{const ps=CONTRASTS.map((p,i)=>[p,i]).filter(([p])=>p[0]===it.c||p[1]===it.c);if(!ps.length)return null;const [p,pi]=pick(ps);return makeDiff(pi,p[0]===it.c?0:1);}
    case "group":{const g=grpOf(it.c);if(!g)return null;const others=shuffle(Object.values(GROUPS).filter(v=>v!==g)).slice(0,3);
      return {type:t,item:it.c,label:"Einordnen",title:"Zu welcher Gruppe gehört diese Diagnose?",q:`<span><b class="code">${esc(it.c)}</b> ${esc(it.n)}</span>`,opts:shuffle([g,...others]).map(v=>({h:esc(v),ok:v===g}))};}
    case "type":return {type:t,item:it.c,label:"Code eintippen",title:block?"Tippe den Anfang der Gruppe ein":"Tippe den Code ein",q:`<span>${esc(it.n)}</span>`};
  }
  return null;
}
const optCode=c=>`<span class="code">${esc(c)}</span>${esc(ITEMS[c].n)}`;
function makeDiff(pi,side){const p=CONTRASTS[pi],a=p[side],b=p[1-side];if(!ITEMS[a]||!ITEMS[b])return null;
  return {type:"diff",item:a,label:"Abgrenzung",title:"Was passt besser?",q:`<span>${esc(p[2+side])}</span>`,opts:shuffle([a,b]).map(c=>({h:optCode(c),ok:c===a})),why:esc(p[4])};}
function makeCase(ci){const c=CASES[ci];if(!ITEMS[c.a])return null;const ds=c.d.filter(d=>ITEMS[d]&&d!==c.a);
  return {type:"case",item:c.a,label:"Fallbeispiel",title:"Welche Diagnose passt am besten?",q:`<span>${esc(c.t)}</span>`,opts:shuffle([c.a,...ds]).map(x=>({h:optCode(x),ok:x===c.a})),why:esc(c.w)};}
function makeMatch(pool){const its=shuffle(pool.slice()).slice(0,4);if(its.length<4)return null;
  return {type:"match",item:null,label:"Paare finden",title:"Ordne Codes und Bezeichnungen zu",left:shuffle(its.map(x=>x.c)),right:shuffle(its.map(x=>x.c)),done:[]};}
function weightedOrder(items){return shuffle(items.slice()).sort((a,b)=>boxOf(a.c)-boxOf(b.c)+(Math.random()-.5)*1.5);}
function buildLesson(uid,mode){
  let pool,lvl=4,n=10;
  if(mode==="review"){pool=[...new Set(S.mistakes)].map(c=>ITEMS[c]).filter(Boolean).slice(0,12);n=Math.min(12,Math.max(pool.length*2,6));}
  else if(mode==="mix"){const started=UNITS.filter(u=>(S.units[u.id]||0)>0).flatMap(u=>itemsOf(u.id));pool=started.length>=6?started:itemsOf(UNITS[0].id).concat(itemsOf(UNITS[1].id));n=12;}
  else{const u=U(uid);
    if(u.kind==="diff"){const sides=shuffle(CONTRASTS.flatMap((p,i)=>[[i,0],[i,1]]));const ex=[],used=new Set();
      for(const [pi,s] of sides){if(ex.length>=10)break;if(used.has(pi)&&sides.length>20)continue;used.add(pi);const e=makeDiff(pi,s);if(e)ex.push(e);}return ex;}
    if(u.kind==="case")return shuffle(u.cases.slice()).map(makeCase).filter(Boolean);
    pool=itemsOf(uid);if(mode==="path")lvl=S.units[uid]||0;}
  if(!pool.length)return [];
  let focus=pool;
  if(mode==="path"&&lvl===0)focus=pool.slice(0,Math.max(4,Math.ceil(pool.length*.6)));
  const T=[["name","code","vig"],["name","code","vig","i10","group"],["name","code","type","vig","i10","group"],["vig","type","code","i10","group","name","diff"],["vig","type","type","code","i10","group","name","diff"]][Math.min(4,lvl)];
  const order=weightedOrder(focus),ex=[];let i=0,guard=0;
  while(ex.length<n&&guard++<300){const it=order[i++%order.length];const last=ex[ex.length-1];if(last&&last.item===it.c&&order.length>1)continue;
    const e=makeEx(pick(T),it,pool);if(e)ex.push(e);}
  if(lvl>=1&&mode!=="review"){const mt=makeMatch(pool);if(mt)ex.splice(Math.min(5,ex.length),0,mt);}
  return ex;
}

/* ---------- Lektion ---------- */
let L=null;
function startLesson(uid,mode){
  refillHearts();
  if(mode==="review"&&!S.mistakes.length){toast("Gerade keine Fehler offen");return;}
  if(mode!=="review"&&S.hearts.n<=0){showNoHearts();return;}
  const q=buildLesson(uid,mode);if(!q.length){toast("Keine Aufgaben gefunden");return;}
  const title=mode==="review"?"Fehler wiederholen":mode==="mix"?"Schnelle Runde":U(uid).title;
  L={uid,mode,title,queue:q,idx:0,ans:null,state:"q",correct:0,wrong:0,wrongFirst:0,combo:0,requeued:new Set(),codes:new Set(),startLvl:uid?(S.units[uid]||0):0};
  LZ().hidden=false;document.body.classList.add("lock");renderEx();
}
function showNoHearts(){openSheet(`<div class="sic">${IC.heart}</div><h2>Keine Herzen mehr</h2><p class="muted">Das nächste Herz kommt in etwa ${nextHeartMin()} Minuten. Oder wiederhole deine Fehler: Jede abgeschlossene Wiederholung bringt ein Herz zurück.</p>
  ${S.mistakes.length?`<button class="btn primary block" id="nhRev">Fehler wiederholen</button>`:""}<button class="btn block" data-close>Später</button>`);
  const b=$("#nhRev");if(b)b.onclick=()=>{closeSheet();startLesson(null,"review");};}
const curEx=()=>L.queue[L.idx];
function exHtml(x){
  let body="";
  if(x.type==="type")body=`<input class="field codein" id="ti" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="z. B. 6B00" value="${esc(L.ans||"")}" aria-label="Code">`;
  else if(x.type==="match")body=`<div class="match"><div class="col">${x.left.map(c=>`<button class="tile code ${x.done.includes(c)?"gone":""}" data-ml="${esc(c)}">${esc(c)}${ITEMS[c].map?"…":""}</button>`).join("")}</div>
     <div class="col">${x.right.map(c=>`<button class="tile ${x.done.includes(c)?"gone":""}" data-mr="${esc(c)}">${esc(ITEMS[c].n)}</button>`).join("")}</div></div>`;
  else body=`<div class="opts">${x.opts.map((o,i)=>`<button class="opt ${x.codeonly?"codeonly":""}" data-o="${i}" aria-pressed="${L.ans===i}"><span class="k">${i+1}</span><span>${o.h}</span></button>`).join("")}</div>`;
  return `<div class="etype">${esc(x.label)}${L.combo>=3?`<span class="streakchip">${IC.flame}${L.combo} in Folge</span>`:""}</div><div class="qtitle">${esc(x.title)}</div>${x.q?`<div class="qtext ${x.type==="case"||x.type==="diff"?"long":""}">${x.q}</div>`:""}${body}`;
}
function canCheck(){const x=curEx();if(x.type==="type")return !!(L.ans&&L.ans.trim());if(x.type==="match")return false;return L.ans!==null;}
function answerText(x){if(x.type==="group")return esc(grpOf(x.item));const it=ITEMS[x.item];return `<span class="code">${esc(it.c)}${it.map?"…":""}</span> ${esc(it.n)}`;}
function footHtml(x){
  if(L.state==="q"){if(x.type==="match")return `<div class="lfin"><span class="muted small grow">Tippe links einen Code, dann rechts die passende Bezeichnung.</span></div>`;
    return `<div class="lfin"><button class="btn primary block" id="chk" ${canCheck()?"":"disabled"}>Prüfen</button></div>`;}
  const ok=L.state==="ok",it=x.item?ITEMS[x.item]:null;
  const praise=pick(["Richtig!","Genau!","Sehr gut!","Stimmt!","Sitzt!"]);
  let why="";if(x.why)why=x.why;
  else if(it&&!it.map){const bits=[];if(x.type!=="vig"&&it.k)bits.push(esc(it.k));if(it.i10)bits.push(i10Html(it));why=bits.join(" · ");}
  else if(it&&it.map&&x.type!=="vig")why=esc(it.k);
  return `<div class="lfin"><div class="fb grow"><div class="fbhead"><span class="fbi">${ok?IC.check:IC.x}</span><div class="fbt"><b>${ok?praise:"Nicht ganz"}</b>
    ${x.type==="match"?"":`<p>${ok?"":"Richtig: "}<span class="ans">${answerText(x)}</span></p>`}${why?`<p class="why small">${why}</p>`:""}</div></div>
    <button class="btn ${ok?"good":"bad"} block" id="nx">Weiter</button></div></div>`;
}
function renderEx(anim=true){
  const x=curEx(),pct=Math.round(L.idx/L.queue.length*100);
  LZ().innerHTML=`<div class="lhead"><button class="iconbtn" id="quit" aria-label="Lektion beenden">${IC.x}</button><div class="lprog"><i style="width:${pct}%"></i></div>
    <div class="lhearts ${L.mode==="review"?"xp":""}">${L.mode==="review"?IC.replay:IC.heart+S.hearts.n}</div></div>
    <div class="lbody"><div class="lwrap ${anim?"enter":""}">${exHtml(x)}</div></div><div class="lfoot ${L.state==="ok"?"ok":L.state==="no"?"no":""}" id="lfoot">${footHtml(x)}</div>`;
  wireEx();
}
function setFoot(){const x=curEx(),f=$("#lfoot");f.className="lfoot "+(L.state==="ok"?"ok":L.state==="no"?"no":"");f.innerHTML=footHtml(x);wireFoot();}
function wireFoot(){const c=$("#chk");if(c)c.onclick=check;const n=$("#nx");if(n){n.onclick=next;setTimeout(()=>n.focus({preventScroll:true}),30);}}
function wireEx(){
  $("#quit").onclick=askQuit;const x=curEx();
  $$("[data-o]").forEach(b=>b.onclick=()=>{if(L.state!=="q")return;L.ans=+b.dataset.o;$$("[data-o]").forEach(o=>o.setAttribute("aria-pressed",String(+o.dataset.o===L.ans)));$("#chk").disabled=false;});
  const ti=$("#ti");if(ti){ti.oninput=()=>{L.ans=ti.value;$("#chk").disabled=!canCheck();};setTimeout(()=>ti.focus(),60);}
  if(x.type==="match"){let selL=null;
    $$("[data-ml]").forEach(b=>b.onclick=()=>{if(b.classList.contains("gone"))return;$$("[data-ml]").forEach(o=>o.classList.remove("sel"));b.classList.add("sel");selL=b.dataset.ml;});
    $$("[data-mr]").forEach(b=>b.onclick=()=>{if(b.classList.contains("gone")||L.state!=="q")return;
      if(!selL){$$("[data-mr]").forEach(o=>o.classList.remove("sel"));b.classList.add("sel");return;}
      const l=$(`[data-ml="${CSS.escape(selL)}"]`);
      if(b.dataset.mr===selL){x.done.push(selL);l.classList.remove("sel");l.classList.add("gone");b.classList.add("gone");tones([[700,.08]]);selL=null;
        if(x.done.length===x.left.length){grade(true);}}
      else{b.classList.add("wrong");l.classList.add("wrong");x.miss=(x.miss||0)+1;sndNo();setTimeout(()=>{b.classList.remove("wrong");l.classList.remove("wrong");},400);}});}
  wireFoot();
}
const norm=s=>String(s||"").toUpperCase().replace(/\s+/g,"").replace(/,/g,".").replace(/[…\.]+$/,"").replace(/O/g,"0").replace(/I/g,"1");
function check(){
  const x=curEx();if(L.state!=="q"||!canCheck())return;let ok;
  if(x.type==="type")ok=norm(L.ans)===norm(x.item);
  else{ok=!!x.opts[L.ans].ok;$$("[data-o]").forEach(b=>{const i=+b.dataset.o;b.disabled=true;if(x.opts[i].ok)b.classList.add("ok");else if(i===L.ans)b.classList.add("no");});}
  if(x.type==="type"){const ti=$("#ti");ti.disabled=true;ti.style.borderColor=ok?"var(--good)":"var(--bad)";}
  grade(ok);
}
function grade(ok){
  const x=curEx();L.state=ok?"ok":"no";S.stats.answered++;
  const codes=x.type==="match"?x.left:[x.item];codes.forEach(c=>L.codes.add(c));
  if(ok){S.stats.correct++;L.correct++;L.combo=(L.combo||0)+1;sndOk();
    codes.forEach(c=>{S.box[c]=Math.min(5,boxOf(c)+1);});
    if(L.mode==="review")S.mistakes=S.mistakes.filter(c=>c!==x.item);}
  else{L.wrong++;if(!L.requeued.has(L.idx))L.wrongFirst++;L.combo=0;sndNo();if(navigator.vibrate)try{navigator.vibrate(60);}catch(e){}
    S.box[x.item]=Math.max(0,boxOf(x.item)-2);if(!S.mistakes.includes(x.item))S.mistakes.push(x.item);S.mistakes=S.mistakes.slice(-60);
    if(L.mode!=="review")loseHeart();
    if(!L.requeued.has(L.idx)){L.requeued.add(L.queue.length);const it=ITEMS[x.item];const again=makeEx(x.type,it,L.mode==="mix"||L.mode==="review"?ALL.filter(i=>i.map===it.map):itemsOf(it.u))||x;L.queue.push(again);}}
  save();setFoot();
  const lh=$(".lhearts");if(lh&&L.mode!=="review")lh.innerHTML=IC.heart+S.hearts.n;
}
function next(){
  if(L.state==="no"&&L.mode!=="review"&&S.hearts.n<=0){failLesson();return;}
  L.idx++;L.ans=null;L.state="q";
  if(L.idx>=L.queue.length){finishLesson();return;}
  renderEx();
}
function askQuit(){openSheet(`<h2>Lektion beenden?</h2><p class="muted">Der Fortschritt dieser Lektion geht verloren. Gesammelte Fehler bleiben zum Wiederholen gespeichert.</p>
  <button class="btn primary block" data-close>Weiterlernen</button><button class="btn block" id="qq">Beenden</button>`);$("#qq").onclick=()=>{closeSheet();closeLesson();};}
function closeLesson(){L=null;LZ().hidden=true;LZ().innerHTML="";document.body.classList.remove("lock");render();}
function failLesson(){
  LZ().innerHTML=`<div></div><div class="lbody"><div class="center"><div class="badge">${IC.heart}</div><h1>Keine Herzen mehr</h1>
    <p class="muted">Kein Problem. Das nächste Herz kommt in etwa ${nextHeartMin()} Minuten. Mit „Fehler wiederholen“ holst du dir sofort eins zurück.</p>
    <button class="btn primary block" id="fr">Fehler wiederholen</button><button class="btn block" id="fb">Zurück</button></div></div><div></div>`;
  $("#fr").onclick=()=>{L=null;startLesson(null,"review");};$("#fb").onclick=closeLesson;
}
function finishLesson(){
  const perfect=L.wrong===0,first=L.queue.length-L.requeued.size;
  let xp=L.mode==="review"?8:perfect?15:10;addXP(xp);S.stats.lessons++;if(perfect)S.stats.perfect++;
  let head="Lektion geschafft",sub=perfect?"Fehlerfrei. Stark!":"Gut gemacht. Deine Fehler kannst du gleich wiederholen.";
  if(L.mode==="path"){const d=S.units[L.uid]||0;if(d===L.startLvl&&d<LPU){S.units[L.uid]=d+1;if(d+1>=LPU){head="Einheit abgeschlossen";sub=`„${L.title}“ ist komplett. Weiter zur nächsten Einheit.`;}}}
  if(L.mode==="review"){refillHearts();S.hearts.n=Math.min(HMAX,S.hearts.n+1);head="Wiederholung geschafft";sub="Ein Herz ist zurück.";}
  save();
  const acc=Math.round((first-L.wrongFirst)/Math.max(1,first)*100);
  const learned=[...L.codes].filter(c=>ITEMS[c]).slice(0,6);
  LZ().innerHTML=`<div></div><div class="lbody"><div class="center"><div class="badge" style="color:var(--gold)">${IC.trophy}</div><h1>${esc(head)}</h1><p class="muted">${esc(sub)}</p>
    <div class="tiles3"><div class="st"><b>XP</b><span>+${xp}</span></div><div class="st"><b>Treffer</b><span>${acc}%</span></div><div class="st"><b>Serie</b><span>${streak()}</span></div></div>
    ${learned.length?`<div class="newwords">${learned.map(c=>`<div class="nw"><b class="code">${esc(c)}${ITEMS[c].map?"…":""}</b><span>${esc(ITEMS[c].n)}</span></div>`).join("")}</div>`:""}
    <button class="btn primary block" id="fin">Weiter</button></div></div><div></div>`;
  sndWin();confetti();$("#fin").onclick=closeLesson;setTimeout(()=>$("#fin")&&$("#fin").focus(),50);
}
document.addEventListener("keydown",e=>{
  if(!$("#sheet").hidden){if(e.key==="Escape")closeSheet();return;}
  if(!L||LZ().hidden)return;

     <button class="it" id="rs"><span class="ii">${IC.trash}</span><span class="lb"><b>Fortschritt zurücksetzen</b></span><span class="chv">${IC.chev}</span></button>
   </div>
   <p class="legal">ICD11 Compass ist eine private Lernhilfe. Codes und Bezeichnungen nach der ICD-11 für Mortalitäts- und Morbiditätsstatistiken (MMS) der WHO in der deutschen Testfassung des BfArM (Release 2026-01), lizenziert unter CC BY-ND 3.0 IGO. Keine offizielle Anwendung der WHO oder des BfArM. Kurzbeschreibungen, Abgrenzungen und Fälle sind eigene, vereinfachte Lernzusammenfassungen und ersetzen weder die Originalklassifikation noch die diagnostischen Leitlinien (CDDR). Maßgeblich ist icd.who.int.</p>
   <p class="foot">ICD11 Compass · Dein Fortschritt bleibt auf diesem Gerät</p>`;
  $("#goal").onchange=e=>{S.cfg.goal=+e.target.value;save();renderTop();};
  $("#snd").onchange=e=>{S.cfg.sound=e.target.checked;save();};
  $("#thm").onchange=e=>{S.cfg.theme=e.target.value;save();applyTheme();};
  $("#bk").onclick=exportBackup;
  $("#im").onclick=()=>$("#importFile").click();
  $("#rs").onclick=()=>{openSheet(`<h2>Alles zurücksetzen?</h2><p class="muted">Lernpfad, Serie, XP und Codestufen werden auf diesem Gerät gelöscht. Das lässt sich nicht rückgängig machen, außer du hast eine Sicherung.</p>
    <button class="btn bad block" id="rsy">Zurücksetzen</button><button class="btn block" data-close>Abbrechen</button>`);
    $("#rsy").onclick=()=>{const cfg=S.cfg;S=blank();S.cfg=cfg;S.onb=true;save();closeSheet();render();toast("Fortschritt zurückgesetzt");};};
}
function exportBackup(){
  S.lastBackup=Date.now();save();
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=`icd11-compass-sicherung-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast("Sicherung erstellt");if(current==="profil")render();
}
$("#importFile").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!=="object"||!o.units||!o.box)throw 0;
    openSheet(`<h2>Sicherung laden?</h2><p class="muted">Der aktuelle Fortschritt auf diesem Gerät wird durch die Sicherung ersetzt.</p><button class="btn primary block" id="imy">Laden</button><button class="btn block" data-close>Abbrechen</button>`);
    $("#imy").onclick=()=>{S=merge(o);S.onb=true;save();applyTheme();closeSheet();render();toast("Sicherung geladen");};}
    catch(err){toast("Das ist keine gültige Sicherung");}};r.readAsText(f);};

/* ---------- Start ---------- */
let OB={step:0,goal:20};
function showOnb(){const el=$("#onb");el.hidden=false;document.body.classList.add("lock");
  if(OB.step===0)el.innerHTML=`<div class="center"><div class="hlogo">${LOGO_SVG}</div><h1>ICD11 Compass</h1><p class="lead">Lerne die Codes der ICD-11 für psychische Störungen. Kurze Lektionen, Fallbeschreibungen, ICD-10-Vergleiche und Karteikarten, damit die Codes für die Ausbildung sitzen.</p>
    <div class="steps"><i class="on"></i><i></i></div><button class="btn primary block" id="o1">Los geht’s</button></div>`;
  else el.innerHTML=`<div class="center"><h1>Wie viel Zeit pro Tag?</h1><p class="lead">Dein Tagesziel. Kleine, regelmäßige Einheiten wirken am besten.</p>
    <div class="choice">${[[10,"Locker","etwa 3 Minuten"],[20,"Normal","etwa 6 Minuten"],[30,"Ernsthaft","etwa 10 Minuten"],[50,"Intensiv","etwa 15 Minuten"]].map(([v,l,d])=>`<button class="ch" data-g="${v}" aria-pressed="${OB.goal===v}"><span class="big">${v}</span><div><b>${l}</b><span>${d}</span></div></button>`).join("")}</div>
    <div class="steps"><i class="on"></i><i class="on"></i></div><button class="btn primary block" id="o2">Starten</button></div>`;
  const a=$("#o1");if(a)a.onclick=()=>{OB.step=1;showOnb();};
  $$("[data-g]").forEach(b=>b.onclick=()=>{OB.goal=+b.dataset.g;showOnb();});
  const b=$("#o2");if(b)b.onclick=()=>{S.cfg.goal=OB.goal;S.onb=true;save();el.hidden=true;el.innerHTML="";document.body.classList.remove("lock");render();};
}
applyTheme();render();
if(!S.onb)showOnb();
setInterval(()=>{if(!L&&$("#sheet").hidden)renderTop();},60e3);
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
